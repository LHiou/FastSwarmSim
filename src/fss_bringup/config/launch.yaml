num_drones: 1
use_perfect_drone: false
use_fss_sim_time: true
real_time_factor: 1.0
sensing_enable: true
lidar_config: local_pointcloud_sim.yaml

rviz_enable: false
enable_visualizer: true
vis.visualize_max_freq: 60.0
vis.visualize_path_time: 30.0

vehicles:
  - namespace: uav1
    position: [0.0, 0.0, 0.0]  # 东、北、上，m
    yaw_deg: 0.0
    color: red
  # num_drones 改为 2 后，取消下面的注释可指定第二架的起点。
  # - namespace: uav2
  #   position: [3.0, 0.0, 0.0]
  #   yaw_deg: 90.0
  #   color: blue
